input {
  beats {
    port => 5044
  }
}

filter {

  ########################################################
  # 1. COMPANY ID SAFETY
  ########################################################
  ruby {
    code => '
      cid = event.get("company_id")
      event.set("company_id", cid ? cid.to_s : "unknown")
    '
  }

  ########################################################
  # 2. MACHINE NORMALIZATION (CRITICAL FOR YOUR DASHBOARD)
  ########################################################
  ruby {
    code => '
      machine =
        event.get("[host][name]") ||
        event.get("[agent][name]") ||
        event.get("[winlog][computer_name]") ||
        event.get("host") ||
        "unknown"

      event.set("machine", machine)
    '
  }

  ########################################################
  # 3. EVENT ID NORMALIZATION (FIXES YOUR BROKEN RULES)
  ########################################################
  ruby {
    code => '
      eid =
        event.get("[event][code]") ||
        event.get("[winlog][event_id]") ||
        event.get("event_id")

      if eid
        event.set("event_id", eid.to_s)
      else
        event.set("event_id", "unknown")
      end
    '
  }

  ########################################################
  # 4. ALERT MAPPING (YOUR DETECTION RULES)
  ########################################################

  if [event_id] == "4625" {
    mutate {
      add_field => {
        "alert_type" => "failed_login"
        "severity" => "medium"
      }
    }
  }

  else if [event_id] == "4740" {
    mutate {
      add_field => {
        "alert_type" => "account_lockout"
        "severity" => "high"
      }
    }
  }

  else if [event_id] == "4720" {
    mutate {
      add_field => {
        "alert_type" => "new_admin_account"
        "severity" => "high"
      }
    }
  }

  else if [event_id] == "4663" {
    mutate {
      add_field => {
        "alert_type" => "file_or_usb_activity"
        "severity" => "medium"
      }
    }
  }

  else if [event_id] == "4104" {
    mutate {
      add_field => {
        "alert_type" => "powershell_exec"
        "severity" => "low"
      }
    }
  }

  else if [event_id] == "4950" {
    mutate {
      add_field => {
        "alert_type" => "firewall_disabled"
        "severity" => "critical"
      }
    }
  }

  else if [event_id] == "7036" {
    mutate {
      add_field => {
        "alert_type" => "service_status_change"
        "severity" => "low"
      }
    }
  }

  ########################################################
  # 5. DEFAULTS (IMPORTANT FOR UI STABILITY)
  ########################################################
  if ![alert_type] {
    mutate {
      add_field => {
        "alert_type" => "system_event"
        "severity" => "low"
      }
    }
  }
}

ruby {
  code => '
    machine =
      event.get("[host][name]") ||
      event.get("[agent][name]") ||
      event.get("machine") ||
      "unknown"

    event.set("machine", machine)
  '
}

########################################################
# OUTPUT
########################################################
output {

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "soc-logs-%{company_id}-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
