input {
  beats {
    port => 5044
  }
}

filter {

  # ─────────────────────────────────────────
  # FIX company_id (CRITICAL FOR MULTI-TENANT)
  # ─────────────────────────────────────────
  ruby {
    code => '
      cid =
        event.get("[fields][company_id]") ||
        event.get("company_id")

      # FORCE fallback to IIBS if missing
      if cid.nil? || cid == ""
        cid = "IIBS"
      end

      event.set("company_id", cid.to_s)
    '
  }

  # ─────────────────────────────────────────
  # NORMALIZE MACHINE NAME
  # ─────────────────────────────────────────
  ruby {
    code => '
      machine =
        event.get("[host][name]") ||
        event.get("[agent][name]") ||
        event.get("[winlog][computer_name]") ||
        "unknown"

      event.set("machine", machine.to_s)
    '
  }

  # ─────────────────────────────────────────
  # NORMALIZE EVENT ID
  # ─────────────────────────────────────────
  ruby {
    code => '
      eid =
        event.get("[winlog][event_id]") ||
        event.get("[event][code]") ||
        event.get("event_id")

      event.set("event_id", eid.to_s)
    '
  }

  # ─────────────────────────────────────────
  # ALERT CLASSIFICATION
  # ─────────────────────────────────────────
  if [event_id] == "4625" {
    mutate { add_field => { "alert_type" => "failed_login" "severity" => "medium" } }
  }
  else if [event_id] == "4740" {
    mutate { add_field => { "alert_type" => "account_lockout" "severity" => "high" } }
  }
  else if [event_id] == "4720" {
    mutate { add_field => { "alert_type" => "new_admin_account" "severity" => "high" } }
  }
  else if [event_id] == "4663" {
    mutate { add_field => { "alert_type" => "usb_or_file_access" "severity" => "medium" } }
  }
  else if [event_id] == "4104" {
    mutate { add_field => { "alert_type" => "powershell_exec" "severity" => "low" } }
  }
  else if [event_id] == "4950" {
    mutate { add_field => { "alert_type" => "firewall_disabled" "severity" => "critical" } }
  }
  else if [event_id] == "7036" {
    mutate { add_field => { "alert_type" => "service_status_change" "severity" => "low" } }
  }
  else {
    mutate {
      add_field => {
        "alert_type" => "system_event"
        "severity" => "low"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # IMPORTANT: correct tenant index
    index => "soc-logs-%{company_id}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}